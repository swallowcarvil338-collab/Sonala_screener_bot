name: Daily Solana Screener

"on":
  schedule:
    # Tiap 4 jam, geser ke menit :17 (bukan :00) untuk menghindari antrian
    # GitHub yang padat di awal jam — lihat catatan GitHub soal keterlambatan
    # jadwal di https://docs.github.com/actions/using-workflows/events-that-trigger-workflows#schedule
    - cron: '17 1,5,9,13,17,21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daily_screener.py

      - name: Save flagged tokens log back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update flagged tokens log"
          git push
          
