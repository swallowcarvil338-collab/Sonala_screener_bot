name: Daily Solana Screener

"on":
  schedule:
    # Tiap 4 jam: 01:00, 05:00, 09:00, 13:00, 17:00, 21:00 UTC
    # = 08:00, 12:00, 16:00, 20:00, 00:00, 04:00 WIB
    - cron: '0 1,5,9,13,17,21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daily_screener.py

      - name: Save flagged tokens log back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update flagged tokens log"
          git push
